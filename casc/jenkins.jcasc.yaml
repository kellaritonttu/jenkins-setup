jenkins:
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: dockerhub-credentials
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
              description: "Docker Hub access token"
              scope: GLOBAL

          - usernamePassword:
              id: github-credentials
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub fine-grained PAT"
              scope: GLOBAL
 

jobs:
  - script: >
      pipelineJob('seed') {
        definition {
          cps {
            script(readFileFromWorkspace('/var/jenkins_jobs/seed.groovy'))
            sandbox(false)
          }
        }
      }

unclassified:
  globalLibraries:
    libraries:
      - name: "shared"
        defaultVersion: "main"
        implicit: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/kellaritonttu/jenkins-setup"